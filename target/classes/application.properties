server.port=8080
spring.application.name=sonido-vivo-backend

# Base de datos H2 por defecto para ejecución inmediata sin instalar nada
# Para usar MySQL en producción/Docker, arrancar con: -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:h2:mem:sonidovivodb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Config (Clave HMAC-SHA256 de >= 256 bits)
jwt.secret=U29uaWRvVml2b1NlY3JldEtleURTWTEyMDREdW9jVUMyMDI2RnVsbFN0YWNrSUk=
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=86400000

# Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
